
spring.data.mongodb.host: localhost
spring.data.mongodb.port: 27017
spring.data.mongodb.database: solar
spring.data.mongodb.authentication-database: admin
spring.data.mongodb.auto-index-creation: true

influx.organisation: my-org
influx.bucket: my-bucket

user.defaultNumSystems: 3
system.defaultMaxSamplesDay: 9000 #sending data every 10sec or 3 devices every 30 sec

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

management:
  server:
    port: 8060
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true