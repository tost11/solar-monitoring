version: "3.7"
services:
  influx:
    image: influxdb:2.2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "influx"
      DOCKER_INFLUXDB_INIT_PASSWORD: "password"
      DOCKER_INFLUXDB_INIT_ORG: "my-org"
      DOCKER_INFLUXDB_INIT_BUCKET: "my-bucket"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "password"
      INFLUXDB_DATA_QUERY_LOG_ENABLED: "true"
    ports:
      - "127.0.0.1:8086:8086"
  neo4j:
    image: neo4j:4.3.7
    environment:
      NEO4J_AUTH: "neo4j/password"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

  influx-test:
    image: influxdb:2.0
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "influx"
      DOCKER_INFLUXDB_INIT_PASSWORD: "password"
      DOCKER_INFLUXDB_INIT_ORG: "my-org"
      DOCKER_INFLUXDB_INIT_BUCKET: "my-bucket"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "password"
    ports:
      - "127.0.0.1:8087:8086"
  neo4j-test:
    image: neo4j:4.3.7
    environment:
      NEO4J_AUTH: "neo4j/password"
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
