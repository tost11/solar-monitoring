
spring.data.mongodb.host: localhost
spring.data.mongodb.port: 27017
spring.data.mongodb.database: solar
spring.data.mongodb.authentication-database: admin
spring.data.mongodb.auto-index-creation: true

influx.organisation: my-org
influx.bucket: my-bucket

management:
  server:
    port: 8060
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus

spring:
  mail:
    host: mail.localhost
    port: 587
    username: service@localhost
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
            required: true
          ssl.trust: mail.localhost